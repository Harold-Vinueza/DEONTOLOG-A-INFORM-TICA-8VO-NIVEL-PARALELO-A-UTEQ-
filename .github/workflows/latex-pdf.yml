
name: Compilar todos los documentos LaTeX

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.bib'
      - '**/*.sty'
      - '**/*.cls'
      - '**/*.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar todos los documentos LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: '**/main.tex'
          compiler: latexmk
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          continue_on_error: false

      - name: Comprobar PDF generados
        shell: bash
        run: |
          echo "Documentos PDF encontrados:"
          find . -type f -name '*.pdf' -not -path './.git/*' -print

          if ! find . -type f -name '*.pdf' -not -path './.git/*' -print -quit | grep -q .; then
            echo "::error::No se encontraron archivos PDF generados."
            exit 1
          fi

      - name: Guardar los PDF generados en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar PDF compilados"
          file_pattern: '**/*.pdf'
          disable_globbing: true
